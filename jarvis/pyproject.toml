[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "2.0.0"
description = "JARVIS - Personal Voice Assistant (Hinglish) - Desktop & Web"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "JARVIS"}]
license = {text = "MIT"}
keywords = ["voice-assistant", "ai", "jarvis", "hinglish", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "requests>=2.31.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "SpeechRecognition>=3.10.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "gTTS>=2.5.0",
    "playsound==1.2.2",
    "pygame>=2.5.0",
    "edge-tts>=6.1.11",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]
offline = [
    "pyaudio>=0.2.14",
    "piper-tts>=1.2.0",
    "vosk>=0.3.45",
    "openwakeword>=0.6.0",
]
whatsapp = [
    "pywhatkit>=5.4",
]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-web = "jarvis.web_cli:run_web"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvis*"]

[tool.ruff]
target-version = "py310"
line-length = 100
indent-width = 4
fix = true
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "ARG", "RET", "S", "PL", "RUF", "EXE", "EM"]
ignore = ["E501", "N802", "N803"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "ARG001"]
"**/web/index.html" = ["ALL"]
"**/*.bat" = ["ALL"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-v", "--tb=short"]
asyncio_mode = "auto"